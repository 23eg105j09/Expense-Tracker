# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:expense_tracker;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration
expense.tracker.jwtSecret=${JWT_SECRET:SecretKeyForGenJWTs67890123456789012345678901234567890}
expense.tracker.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Server Configuration
server.port=8080
